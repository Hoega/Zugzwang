server {
    listen 80;
    server_name zugzwang-theory.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name zugzwang-theory.com;

    ssl_certificate /etc/letsencrypt/live/zugzwang-theory.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zugzwang-theory.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/zugzwang;
    index index.html;

    # API requests → backend container
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback — serve index.html for all client-side routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively
    location ~* \.(js|css|wasm|png|jpg|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
