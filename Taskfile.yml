version: '3'

dotenv: ['backend/.env']

tasks:
  db:
    desc: Start PostgreSQL
    cmd: docker compose up -d

  db:stop:
    desc: Stop PostgreSQL
    cmd: docker compose down

  db:reset:
    desc: Reset database (destroy volume and restart)
    cmds:
      - docker compose down -v
      - docker compose up -d

  backend:build:
    desc: Build the backend
    dir: backend
    cmd: cargo build

  backend:run:
    desc: Run the backend (auto-migrates)
    dir: backend
    deps: [db]
    cmd: cargo run

  backend:test:
    desc: Run backend tests
    dir: backend
    cmd: cargo test

  frontend:check-node:
    desc: Ensure Node >= 22
    silent: true
    cmd: |
      NODE_MAJOR=$(node -v | sed 's/v\([0-9]*\).*/\1/')
      if [ "$NODE_MAJOR" -lt 25 ]; then
        echo "Error: Node >= 25 required (found $(node -v)). Run 'nvm install 25' or 'nvm use 25'." >&2
        exit 1
      fi

  frontend:install:
    desc: Install frontend dependencies
    dir: frontend
    deps: [frontend:check-node]
    cmd: npm install
    status:
      - test -d node_modules

  frontend:run:
    desc: Run the frontend dev server
    dir: frontend
    deps: [frontend:install]
    cmd: npm run dev

  frontend:build:
    desc: Build the frontend for production
    dir: frontend
    deps: [frontend:install]
    cmd: npm run build

  dev:
    desc: Start everything (db + backend + frontend)
    deps: [db]
    cmds:
      - task: backend:run &
      - task: frontend:run
    # NOTE: `task dev` runs backend and frontend sequentially.
    # For parallel startup, use: task backend:run & task frontend:run

  start:
    desc: Start db, backend, and frontend in parallel
    cmds:
      - docker compose up -d
      - cmd: |
          echo "Starting backend and frontend..."
          (cd backend && cargo run) &
          BACKEND_PID=$!
          (cd frontend && npm install --silent && npm run dev) &
          FRONTEND_PID=$!
          trap "kill $BACKEND_PID $FRONTEND_PID 2>/dev/null" EXIT
          wait

  deploy:restart:
    desc: Restart production containers (pull latest, rebuild, restart)
    cmds:
      - |
        ssh -i ~/.ssh/vps_frouxel root@srv1335537.hstgr.cloud '
          set -e &&
          cd /root/Zugzwang &&
          git pull &&
          docker compose -f docker-compose.prod.yml up -d --force-recreate
        '
      - echo "Restarted production containers"

  deploy:quick:
    desc: Git add all, commit with message, and deploy to VPS
    cmds:
      - git add -A
      - git commit -m "{{.CLI_ARGS | default "quick update"}}"
      - git push
      - task: deploy:vps

  deploy:vps:
    desc: Deploy to production VPS (SSH, pull, rebuild)
    cmds:
      - |
        ssh -i ~/.ssh/vps_frouxel root@srv1335537.hstgr.cloud '
          set -e &&
          cd /root/Zugzwang &&
          git pull &&
          docker compose -f docker-compose.prod.yml build &&
          docker build -t zugzwang-frontend ./frontend &&
          CONTAINER=$(docker create zugzwang-frontend /bin/true) &&
          rm -rf /var/www/zugzwang &&
          docker cp $CONTAINER:/build /var/www/zugzwang &&
          docker rm $CONTAINER &&
          docker compose -f docker-compose.prod.yml up -d
        '
      - echo "✅ Deployed to VPS"
